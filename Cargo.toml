[package]
name = "renault-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async, storage-free Rust client for the Renault vehicle API"
license = "MIT"
readme = "README.md"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
